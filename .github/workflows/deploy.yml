name: Deploy

on:
  push:
    branches: [main]
  # A pull request runs `check` and nothing else: the `deploy` job is guarded on
  # `github.event_name != 'pull_request'`, so a branch is verified without being
  # released. Before this existed the workflow fired only on push to `main`,
  # which meant a pull request got no checks at all and "CI must pass before
  # merge" was describing something that had never been true.
  pull_request:
    branches: [main]
  # Lets a failed deploy be retried without an empty commit.
  workflow_dispatch:

# A queued deploy is always superseded by a newer one, but never cancelled
# mid-flight — cancelling between the D1 migration and the Worker upload would
# leave the two out of step.
concurrency:
  # Pull-request runs get their own group per ref, and supersede themselves —
  # pushing twice to a branch should not leave two check runs racing. Production
  # keeps the single serialised group it had, never cancelled mid-flight.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'deploy-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `worker-configuration.d.ts` is generated rather than committed, so the
      # Worker typecheck needs it to exist first. This reads wrangler.jsonc only
      # and needs no credentials.
      - name: Generate Worker types
        run: npx wrangler types

      - name: Typecheck the app
        run: npx tsc --noEmit

      - name: Typecheck the Worker
        run: npx tsc -p tsconfig.worker.json --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npx vite build

      # The review preflight is a gate, and a gate nobody exercises reports
      # success either way. This suite plants the defect each of its checks was
      # written for and confirms that check catches *that* one, so a later edit
      # that quietly makes the gate decorative turns the build red instead of
      # passing silently.
      - name: Attack the review preflight
        run: scripts/attack-preflight.sh

  deploy:
    name: Deploy to Cloudflare
    # `needs: check` is what makes "CI must pass before deploy" true, including
    # via workflow_dispatch, which enters the same job graph rather than
    # bypassing it. The `if` keeps a pull request from deploying anything.
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Worker types
        run: npx wrangler types

      - name: Build
        run: npx vite build

      # Migrations run before the Worker so a new deploy never meets a schema
      # that has not caught up. They are additive and idempotent.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply jsonapi-lens-shares --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker and assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test the deployment
        run: |
          set -euo pipefail
          BASE=https://jsonapi.mstool.dev

          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$BASE/api/health" || echo 000)
            [ "$code" = "200" ] && break
            echo "waiting for the deployment, attempt $i: $code"
            sleep 6
          done

          # Download first, then match. Piping curl into `grep -q` makes grep
          # close the pipe on its first match, which curl reports as a write
          # error (exit 23) and `pipefail` turns into a failed deploy.
          check() {
            curl -sf --max-time 15 "$1" -o /tmp/smoke.out
            grep -q "$2" /tmp/smoke.out || { echo "missing '$2' at $1"; exit 1; }
            echo "ok: $1"
          }

          check "$BASE/api/health" '"ok":true'
          check "$BASE/" '<title>'
          check "$BASE/view" '<title>'
          echo "Deployment healthy."
